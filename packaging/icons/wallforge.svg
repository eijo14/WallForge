<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient Cyan-Indigo -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#312e81" stroke-width="4"/>

  <!-- Subtle Pixel Grid Background -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="2">
    <line x1="80" y1="80" x2="432" y2="80"/>
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="260" x2="432" y2="260"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="80" y1="380" x2="432" y2="380"/>
    <line x1="80" y1="432" x2="432" y2="432"/>

    <line x1="80" y1="80" x2="80" y2="432"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="200" y1="80" x2="200" y2="432"/>
    <line x1="260" y1="80" x2="260" y2="432"/>
    <line x1="320" y1="80" x2="320" y2="432"/>
    <line x1="380" y1="80" x2="380" y2="432"/>
    <line x1="432" y1="80" x2="432" y2="432"/>
  </g>

  <!-- Inner Diamond Frame (Retro Pixel Portal) -->
  <polygon points="256,76 436,256 256,436 76,256" fill="#0f1624" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Pixelated Retro Sun Inside Portal -->
  <circle cx="256" cy="220" r="64" fill="url(#sunGrad)"/>
  
  <!-- Sun Horizontal Scanlines (Synthwave/Pixel vibe) -->
  <line x1="192" y1="216" x2="320" y2="216" stroke="#0f1624" stroke-width="6"/>
  <line x1="202" y1="232" x2="310" y2="232" stroke="#0f1624" stroke-width="8"/>
  <line x1="216" y1="248" x2="296" y2="248" stroke="#0f1624" stroke-width="10"/>

  <!-- Geometric Mountain Peaks -->
  <!-- Back Mountain -->
  <polygon points="170,350 256,260 342,350" fill="#4338ca" opacity="0.8"/>
  <!-- Front Left Peak -->
  <polygon points="120,380 200,290 280,380" fill="#3b82f6"/>
  <!-- Front Right Peak -->
  <polygon points="240,380 320,280 400,380" fill="#06b6d4"/>

  <!-- Accent Diamonds on Corner Anchors -->
  <polygon points="256,60 268,76 256,92 244,76" fill="#38bdf8"/>
  <polygon points="436,244 452,256 436,268 420,256" fill="#818cf8"/>
  <polygon points="256,420 268,436 256,452 244,436" fill="#c084fc"/>
  <polygon points="76,244 92,256 76,268 60,256" fill="#38bdf8"/>

  <!-- Modern Pixel "W" Accent Motif at Base -->
  <rect x="232" y="388" width="12" height="12" fill="#22d3ee"/>
  <rect x="248" y="400" width="16" height="12" fill="#6366f1"/>
  <rect x="268" y="388" width="12" height="12" fill="#22d3ee"/>
</svg>
